# Clase 11 / 12 — DAG completo: ingesta -> calidad -> features -> inferencia -> monitoreo
resources:
  jobs:
    pipeline_demanda:
      name: "[xm-demanda] daily_pipeline"
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Bogota
        pause_status: PAUSED
      email_notifications:
        on_failure:
          - ${var.notification_email}
      tasks:
        - task_key: bronze_ingest
          notebook_task:
            notebook_path: ../notebooks/01_bronze_ingest.py
            base_parameters: { catalog: "${var.catalog}" }
        - task_key: silver_pipeline
          depends_on: [{ task_key: bronze_ingest }]
          pipeline_task:
            pipeline_id: ${resources.pipelines.silver_energia.id}
        - task_key: gold_features
          depends_on: [{ task_key: silver_pipeline }]
          notebook_task:
            notebook_path: ../notebooks/03_gold_features.py
            base_parameters: { catalog: "${var.catalog}" }
        - task_key: batch_inference
          depends_on: [{ task_key: gold_features }]
          notebook_task:
            notebook_path: ../notebooks/05_batch_inference.py
            base_parameters: { catalog: "${var.catalog}", alias: champion }
        - task_key: monitor
          depends_on: [{ task_key: batch_inference }]
          notebook_task:
            notebook_path: ../notebooks/06_monitor.py
            base_parameters: { catalog: "${var.catalog}" }
